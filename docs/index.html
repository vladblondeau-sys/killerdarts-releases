<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Darts Remote</title>
<style>html,body{margin:0;height:100%;background:#0b0d10;color:#8b93a1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<noscript>Open <a href="en.html" style="color:#38bdf8">the remote</a>.</noscript>
<script>
(function () {
  var langs = ["en","fr","de","es","nl"];
  // navigator.languages is ordered by preference; fall back to the single value
  // on older WebViews, and to English when nothing matches.
  var want = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  var pick = "en";
  outer: for (var i = 0; i < want.length; i++) {
    var base = String(want[i] || "").toLowerCase().split("-")[0];
    for (var j = 0; j < langs.length; j++) if (langs[j] === base) { pick = langs[j]; break outer; }
  }
  // The join token travels in the query/hash and must survive the hop, or the
  // scan lands on a page that has forgotten which board it is for.
  location.replace(pick + ".html" + location.search + location.hash);
})();
</script>
</body>
</html>
